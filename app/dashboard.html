<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Registry</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #111; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 8px; }
  p.note { color: #555; margin: 0 0 16px; font-size: 14px; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; white-space: nowrap; }
  th { background: #f4f4f4; }
  td.wrap-text { white-space: normal; min-width: 260px; }
  button { font: inherit; padding: 4px 10px; }
  .muted { color: #777; }
</style>
</head>
<body>
<h1>Patient Registry</h1>
<p class="note">Read-only view of the REST API. Refreshes every 10 seconds. API docs at <a href="/docs">/docs</a>.</p>
<button onclick="load()">Refresh</button>

<h2>Patients</h2>
<div class="wrap"><table id="patients"><thead><tr>
  <th>Name</th><th>DOB</th><th>Sex</th><th>Phone</th><th>Email</th><th>Address</th>
  <th>Insurance</th><th>Language</th><th>Emergency contact</th><th>Created (UTC)</th><th>ID</th>
</tr></thead><tbody></tbody></table></div>

<h2>Recent calls</h2>
<div class="wrap"><table id="calls"><thead><tr>
  <th>When (UTC)</th><th>Status</th><th>Caller</th><th>Ended</th><th>Summary</th><th>Patient ID</th>
</tr></thead><tbody></tbody></table></div>

<script>
const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const phone = p => p ? `${p.slice(0,3)}-${p.slice(3,6)}-${p.slice(6)}` : "";
async function load() {
  try {
    const [p, c] = await Promise.all([fetch("/patients").then(r => r.json()), fetch("/calls?limit=20").then(r => r.json())]);
    document.querySelector("#patients tbody").innerHTML = (p.data || []).map(x => `<tr>
      <td>${esc(x.first_name)} ${esc(x.last_name)}</td><td>${esc(x.date_of_birth)}</td><td>${esc(x.sex)}</td>
      <td>${phone(x.phone_number)}</td><td>${esc(x.email)}</td>
      <td>${esc(x.address_line_1)}${x.address_line_2 ? ", " + esc(x.address_line_2) : ""}, ${esc(x.city)}, ${esc(x.state)} ${esc(x.zip_code)}</td>
      <td>${esc(x.insurance_provider)} ${esc(x.insurance_member_id)}</td><td>${esc(x.preferred_language)}</td>
      <td>${esc(x.emergency_contact_name)} ${phone(x.emergency_contact_phone)}</td>
      <td>${esc((x.created_at || "").slice(0,19))}</td><td class="muted">${esc(x.patient_id)}</td></tr>`).join("")
      || `<tr><td colspan="11" class="muted">No patients yet.</td></tr>`;
    document.querySelector("#calls tbody").innerHTML = (c.data || []).map(x => `<tr>
      <td>${esc((x.created_at || "").slice(0,19))}</td><td>${esc(x.status)}</td><td>${esc(x.caller_number)}</td>
      <td>${esc(x.ended_reason)}</td><td class="wrap-text">${esc(x.summary)}</td><td class="muted">${esc(x.record_id)}</td></tr>`).join("")
      || `<tr><td colspan="6" class="muted">No calls yet.</td></tr>`;
  } catch (e) { console.error(e); }
}
load(); setInterval(load, 10000);
</script>
</body>
</html>
